<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Charm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="grid-bg">
    <div class="sidebar">
        <h2>Charm</h2>

        <div id="main-view">
            <div class="input-field-row">
                <div class="input-field">
                    <label for="start-date-input">START DATE*</label>
                    <input id="start-date-input" type="date">
                </div>
                <div class="input-field">
                    <label for="end-date-input">END DATE</label>
                    <input id="end-date-input" type="date">
                </div>
            </div>

            <div class="input-field">
                <label for="repo-input">GITHUB REPOSITORY</label>
                <input autocomplete="off" autocorrect="off" type="text" id="repo-input">
                <p id="repo-input-error"></p>
            </div>
            <div class="input-field">
                <label for="token-input">HACKATIME TOKEN*</label>
                <input autocomplete="off" autocorrect="off" type="text" id="token-input">
                <p id="token-input-error"></p>
            </div>

            <label>SELECT HACKATIME PROJECTS</label>
            <div id="project-select">
            </div>
            <button id="view-btn" onclick="inspectProjects();" disabled>View</button>
        </div>
        <div id="project-view">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
